spring.application.name=scvi-ventas
server.port=8080
server.error.include-message=always

# BD provisional: H2 en archivo (./data/ventasdb). AUTO_SERVER permite abrirla desde IntelliJ mientras la app corre.
spring.datasource.url=jdbc:h2:file:./data/ventasdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA (Jakarta Persistence + Hibernate): las tablas las crean los scripts SQL, Hibernate solo las usa.
# CamelCaseToUnderscoresNamingStrategy (por defecto de Spring): zonaId -> zona_id, CorteCaja -> corte_caja
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Esquema y datos semilla: cada integrante mantiene sus propios scripts (db/schema-NN-*.sql y db/data-NN-*.sql)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath*:db/schema-*.sql
spring.sql.init.data-locations=classpath*:db/data-*.sql

logging.pattern.level=%5p [%X{traza:-}]
