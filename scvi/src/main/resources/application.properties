spring.application.name=scvi

# Perfil por defecto en local. Producción lo cambia con --spring.profiles.active=prod
# y las pruebas usan @ActiveProfiles("test").
spring.profiles.active=dev

# Lee .env si existe (no versionar). Las variables de entorno del sistema también funcionan.
spring.config.import=optional:file:.env[.properties]

# Configuración mínima de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/scvi?serverTimezone=America/Mexico_City
spring.datasource.username=${SCVI_DB_USER}
spring.datasource.password=${SCVI_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Servidor
server.port=8081

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always